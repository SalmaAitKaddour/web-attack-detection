events {}
http {
  log_format lab escape=json
    '{"time":"$time_iso8601","method":"$request_method","uri":"$request_uri",'
    '"body":"$request_body","status":$status,'
    '"label":"$http_x_label","scenario":"$http_x_scenario","run":"$http_x_run"}';
  access_log /var/log/nginx/lab.log lab;
  client_body_buffer_size 64k;

  server {
    listen 80;
    location / {
      proxy_pass http://juice-shop:3000;
      proxy_set_header Host $host;
    }
  }
}